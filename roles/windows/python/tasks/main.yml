---
- name: Install python packages
  ansible.builtin.include_tasks: ../../common/tasks/install_from_catalog.yml
  vars:
    software_catalog_entry: python.yml
    software_package_list: "{{ python_packages }}"

- name: Add software paths
  ansible.builtin.include_tasks: ../../common/tasks/add_path.yml
  loop: "{{ resolved_packages }}"
  loop_control:
    loop_var: pkg

- name: Add environment variables
  ansible.builtin.include_tasks: ../../common/tasks/configure_environment_variables.yml
  vars:
    environment_variables: "{{ pkg.env.variables }}"
  when: pkg.env is defined and pkg.env.enabled | default(false)
  loop: "{{ resolved_packages }}"
  loop_control:
    loop_var: pkg    

- name: Add registry entries
  ansible.builtin.include_tasks: ../../common/tasks/add_registry.yml
  vars:
    registry_entries: "{{ item.registry.entries }}"
  when: item.registry is defined and item.registry.enabled | default(false)
  loop: "{{ resolved_packages }}"

- name: Add certificates
  ansible.builtin.include_tasks: ../../common/tasks/add_certificate.yml
  vars:
    certificate_entries: "{{ item.certificate.entries }}"
  when:
    - item.certificate is defined
    - item.certificate.enabled | default(false)
  loop: "{{ resolved_packages }}"

# pip configuration runs on EVERY play, so changes reach existing machines.
- name: Check internal CA bundle exists
  ansible.windows.win_stat:
    path: "{{ ca_bundle_path }}"
  register: _ca_bundle

- name: Fail if internal CA bundle is missing
  ansible.builtin.assert:
    that: _ca_bundle.stat.exists
    fail_msg: >-
      CA bundle not found at {{ ca_bundle_path }}.
      Add the ca_bundle role before python.

- name: Ensure global pip config folder exists
  ansible.windows.win_file:
    path: C:\ProgramData\pip
    state: directory

- name: Write global pip configuration for all users
  ansible.windows.win_template:
    src: pip.ini.j2
    dest: C:\ProgramData\pip\pip.ini
