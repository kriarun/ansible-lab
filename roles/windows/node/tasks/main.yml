---
- name: Install Node.js packages
  ansible.builtin.include_tasks: ../../common/tasks/install_from_catalog.yml
  vars:
    software_catalog_entry: node.yml
    software_package_list: "{{ node_packages }}"

# Configuration runs on EVERY play (not only on fresh install), so registry/CA
# changes reach existing machines and survive Node/npm upgrades.

- name: Write npm configuration for all users
  ansible.windows.win_template:
    src: npmrc.j2
    dest: "{{ npm_builtin_npmrc_path }}"
