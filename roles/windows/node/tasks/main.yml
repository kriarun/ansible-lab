---
- name: Install Node.js packages
  ansible.builtin.include_tasks: ../../common/tasks/install_from_catalog.yml
  vars:
    software_catalog_entry: node.yml
    software_package_list: "{{ node_packages }}"

# Configuration runs on EVERY play (not only on fresh install), so registry/CA
# changes reach existing machines and survive Node/npm upgrades.

- name: Check internal CA bundle exists
  ansible.windows.win_stat:
    path: "{{ ca_bundle_path }}"
  register: _ca_bundle

- name: Fail if internal CA bundle is missing
  ansible.builtin.assert:
    that: _ca_bundle.stat.exists
    fail_msg: >-
      CA bundle not found at {{ ca_bundle_path }}.
      Add the ca_bundle role before node.

- name: Write npm configuration for all users
  ansible.windows.win_template:
    src: npmrc.j2
    dest: "{{ npm_builtin_npmrc_path }}"

# npm's cafile only covers npm itself. Node processes (Playwright scripts,
# fetch calls to internal HTTPS APIs) need NODE_EXTRA_CA_CERTS.
- name: Trust internal CA for all Node.js processes
  ansible.builtin.include_tasks: ../../common/tasks/configure_environment_variables.yml
  vars:
    environment_variables:
      NODE_EXTRA_CA_CERTS: "{{ ca_bundle_path }}"
