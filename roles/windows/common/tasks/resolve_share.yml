- name: Validate share fields
  ansible.builtin.assert:
    that:
      - sw.source.share_path is defined
      - sw.source.filename is defined      
    fail_msg: >-
      Software '{{ software_key }}' (share) must define: share_path (directory), filename, install_args

- name: Validate share_path is a directory (not a file path)
  ansible.windows.win_stat:
    path: "{{ sw.source.share_path }}"
  register: share_path_stat

- name: Ensure share_path is a directory
  ansible.builtin.assert:
    that:
      - share_path_stat.stat.isdir
    fail_msg: >-
      Software '{{ software_key }}' (share): share_path must be a DIRECTORY, but it is not:
      '{{ sw.source.share_path }}'


- name: Set resolved item (share)
  ansible.builtin.set_fact:
    _resolved_item_overrides:
      software_key: "{{ software_key }}"

      source:
        type: "share"
        original_path: "{{ sw.source.share_path }}\\{{ sw.source.filename }}"

      installer:
        final_path: "{{ sw.source.share_path }}\\{{ sw.source.filename }}"
        filename: "{{ sw.source.filename }}"

      install:
        type: "{{ sw.install.type }}"
        arguments: "{{ sw.install.arguments | default('') }}"
        destination: "{{ sw.install.destination | default('') }}"
        check:
          path_exists: "{{ sw.install.check.path_exists }}"        

      path: "{{ sw.path | default(omit)}}"

- name: Override values with calculated ones (jfrog)
  ansible.builtin.set_fact:
    resolved_item: "{{ sw | combine(_resolved_item_overrides | default({}), recursive=True) }}"