# -------------------------
# Execute post-installation steps for package
# -------------------------
- name: Adding {{pkg.software_key | default('unknown')}} to path
  ansible.windows.win_path:
    elements: "{{ pkg.path.entries }}"
    scope: machine
    state: present
  when:
    - not _pkg_already_installed
    - pkg.path is defined
    - pkg.path.entries is defined
    - pkg.path.entries | length > 0

- name: Adding configured environment variables for {{pkg.software_key | default('unknown')}} to the system
  win_environment:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    level: machine
    state: present
  loop: "{{ pkg.env.variables | dict2items }}"
  when:
    - not _pkg_already_installed
    - pkg.env is defined
    - pkg.env.variables is defined

# -----------------------
# Verify installation
# -----------------------
- name: Verify installation marker
  ansible.windows.win_stat:
    path: "{{ pkg.install.check.path_exists }}"
  register: is_new_pkg_installed
  when:
    - not _pkg_already_installed

- name: Ensure installation succeeded
  ansible.builtin.assert:
    that:
      - is_new_pkg_installed.stat.exists
    fail_msg: "Installation failed for {{ pkg.software_key }}"
  when:
    - not _pkg_already_installed    

- name: Set new package installed flag
  ansible.builtin.set_fact:
    _new_pkg_installed: "{{ is_new_pkg_installed.stat.exists | bool }}"    
  when:
    - not _pkg_already_installed        