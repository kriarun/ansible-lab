
# -----------------------
# Precheck (Idempotence)
# -----------------------
- name: Check if software already installed (marker)
  ansible.windows.win_stat:
    path: "{{ pkg.install.check.path_exists }}"
  register: marker_check

- name: Set already installed flag
  ansible.builtin.set_fact:
    _pkg_already_installed: "{{ marker_check.stat.exists | bool }}"


# Acquire/Transfer (only if not installed)
- name: Acquire from jfrog
  ansible.builtin.include_tasks: acquire_jfrog.yml
  when:
    - not _pkg_already_installed
    - pkg.source.type == "jfrog"

# -----------------------
#  Validate installer exists (local only)
# -----------------------
- name: Validate local installer exists
  ansible.windows.win_stat:
    path: "{{ pkg.installer.final_path }}"
  register: installer_file
  when:
    - not _pkg_already_installed
    - pkg.source.type == "local"

- name: Fail if installer missing
  ansible.builtin.assert:
    that:
      - installer_file.stat.exists
    fail_msg: "Installer not found at {{ pkg.installer.final_path }}"
  when:
    - not _pkg_already_installed
    - pkg.source.type == "local"

# -------------------------
# Execute pre-installation steps for package
# -------------------------
- name: Execute pre_install steps for - {{pkg.software_key | default('unknown')}}
  ansible.builtin.include_tasks: "{{role_path}}/../common/tasks/pre_install_steps/{{ step.type | default('generic') }}.yml"
  loop: "{{ pkg.pre_install | default([]) }}"
  loop_control:
    loop_var: step
    label: "{{ step.name | default('pre-install-step') }}"
  # Explicitly pass only the variables what the included task needs with _ - clearly marking them as local-to-task variables
  vars:
    _software_key: "{{ pkg.software_key }}"
    _pre_install_step: "{{ step }}"
  when:
    - not _pkg_already_installed
    - pkg.pre_install is defined
    - pkg.pre_install | length > 0

# -----------------------
#  Install 
# -----------------------
- name: Install package (EXE)
  ansible.windows.win_package:
    path: "{{ pkg.installer.final_path }}"
    arguments: "{{ pkg.install.arguments }}"
    state: present  
  when:
    - not _pkg_already_installed
    - pkg.install.type == "exe"


- name: Install package (MSI)
  ansible.windows.win_package:
    path: "{{ pkg.installer.final_path }}"
    arguments: "{{ pkg.install.arguments }}"
    state: present  
  when:
    - not _pkg_already_installed
    - pkg.install.type == "msi" 


- name: Install package (ZIP)
  ansible.builtin.include_tasks: install_zip.yml  
  when:
    - not _pkg_already_installed
    - pkg.install.type == "zip"

