---
# Registers a command with Windows Active Setup: Windows runs it ONCE PER USER,
# as that user, at their next logon. Use for per-user installs (software or
# settings that must land in each user's profile).
#
# Inputs:
#   active_setup_component    unique key name, e.g. ToolboxPostman
#   active_setup_stub_path    command line Windows runs for each user
#   active_setup_fingerprint  string describing WHAT is installed (e.g. the
#                             package list). When it changes, the version is
#                             increased by 1 -> every user re-runs at next logon.
# Output:
#   active_setup_revision     the current revision number
#
# The fingerprint is not used as the version itself: Active Setup only re-runs
# on a HIGHER version, and a hash is not ordered.

- name: Validate Active Setup inputs
  ansible.builtin.assert:
    that:
      - active_setup_component is defined and active_setup_component | length > 0
      - active_setup_stub_path is defined and active_setup_stub_path | length > 0
      - active_setup_fingerprint is defined
    fail_msg: "register_active_setup.yml needs active_setup_component, active_setup_stub_path and active_setup_fingerprint"

- name: Set Active Setup key path
  ansible.builtin.set_fact:
    _as_key: "HKLM:\\SOFTWARE\\Microsoft\\Active Setup\\Installed Components\\{{ active_setup_component }}"
    _as_hash: "{{ active_setup_fingerprint | hash('sha1') }}"

- name: Read stored fingerprint ({{ active_setup_component }})
  ansible.windows.win_reg_stat:
    path: "{{ _as_key }}"
    name: ListHash
  register: _as_stored_hash

- name: Read stored version ({{ active_setup_component }})
  ansible.windows.win_reg_stat:
    path: "{{ _as_key }}"
    name: Version
  register: _as_stored_version

- name: Compute revision ({{ active_setup_component }})
  ansible.builtin.set_fact:
    active_setup_revision: >-
      {{
        _as_current_rev | int
        if (_as_stored_hash.exists and _as_stored_hash.value == _as_hash)
        else (_as_current_rev | int) + 1
      }}
  vars:
    _as_current_rev: >-
      {{ (_as_stored_version.value.split(',') | last) if _as_stored_version.exists else 0 }}

- name: Register with Active Setup ({{ active_setup_component }})
  ansible.windows.win_regedit:
    path: "{{ _as_key }}"
    name: "{{ item.name }}"
    data: "{{ item.data }}"
    type: "{{ item.type }}"
  loop:
    - { name: StubPath,    data: "{{ active_setup_stub_path }}",      type: string }
    - { name: Version,     data: "1,{{ active_setup_revision }}",     type: string }
    - { name: ListHash,    data: "{{ _as_hash }}",                    type: string }
    - { name: IsInstalled, data: 1,                                   type: dword }
  loop_control:
    label: "{{ item.name }}"
