---
# Install type "copy": places the artifact file into install.destination unchanged.
# For files consumed by another tool (e.g. VS Code .vsix files), not executed here.
- name: Ensure destination directory exists
  ansible.windows.win_file:
    path: "{{ pkg.install.destination }}"
    state: directory

- name: Copy artifact into destination
  ansible.windows.win_copy:
    src: "{{ pkg.installer.final_path }}"
    dest: "{{ pkg.install.destination }}\\{{ pkg.installer.filename }}"
    remote_src: true
