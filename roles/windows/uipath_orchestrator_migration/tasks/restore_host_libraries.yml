---
# Restores the host library feed (Orchestrator-Host\Libraries) that was lost with the OS wipe.
# The database still lists these libraries; without the files, new robots cannot download them.
# Orchestrator creates Orchestrator-Host only on the first upload, so robocopy creates it here.
# Source folder is copied to the machine manually (checklist step 8).
# Runs only if the source folder exists AND Orchestrator is installed at the configured path
# (guards against creating folders under a wrong path); otherwise warns and skips.

- name: Restore host libraries | check source folder
  ansible.windows.win_stat:
    path: "{{ uipath_host_libraries_source }}"
  register: _host_libraries_source

- name: Restore host libraries | check Orchestrator is installed at the configured path
  ansible.windows.win_stat:
    path: "{{ uipath_orchestrator_installed_path }}\\UiPath.Orchestrator.exe"
  register: _orchestrator_exe

- name: Restore host libraries | decide
  ansible.builtin.set_fact:
    _restore_host_libraries: >-
      {{ (_host_libraries_source.stat.exists and _host_libraries_source.stat.isdir)
         and _orchestrator_exe.stat.exists }}

- name: Restore host libraries | WARNING - skipping
  ansible.builtin.debug:
    msg: >-
      WARNING: host libraries NOT restored.
      Source {{ uipath_host_libraries_source }} present: {{ _host_libraries_source.stat.exists }},
      Orchestrator found at {{ uipath_orchestrator_installed_path }}: {{ _orchestrator_exe.stat.exists }}.
      Orchestrator runs, but new robots cannot download libraries until they are copied to
      {{ uipath_host_libraries_dest }} (see migration doc, step 13).
  when: not (_restore_host_libraries | bool)

# No /MIR (never delete) and no /SEC (files inherit the folder permissions).
# robocopy skips files with the same size and timestamp, so re-runs copy nothing.
- name: Restore host libraries | robocopy
  community.windows.win_robocopy:
    src: "{{ uipath_host_libraries_source }}"
    dest: "{{ uipath_host_libraries_dest }}"
    flags: /E /R:2 /W:5 /NP /NFL /NDL
  when: _restore_host_libraries | bool