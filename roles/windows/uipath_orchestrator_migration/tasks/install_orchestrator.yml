- name: Render install.json (contains secrets - verify and delete manually after the run)
  ansible.windows.win_template:
    src: install.json.j2
    dest: "{{ uipath_orchestrator_parameters_file }}"
  no_log: true

- name: Install UiPath installer packages
  ansible.builtin.include_tasks: ../../common/tasks/install_from_catalog.yml
  vars:
    software_catalog_entry: uipath_platform.yml
    software_package_list: "{{ uipath_orchestrator_packages }}"
