---
- name: Enable IIS features for Web Management Service
  ansible.builtin.include_tasks: enable_iis_features.yml

- name: Check Web Management Service is installed
  ansible.windows.win_service_info:
    name: WMSvc
  register: _wmsvc_info

- name: Fail if Web Management Service is missing
  ansible.builtin.assert:
    that:
      - _wmsvc_info.services | length > 0
    fail_msg: >-
      WMSvc not found even after enabling the Web-Mgmt-Service feature.

- name: Allow remote connections and require Windows credentials
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\WebManagement\Server
    name: "{{ item.name }}"
    data: "{{ item.data }}"
    type: dword
  loop:
    - { name: EnableRemoteManagement, data: 1 }
    - { name: RequiresWindowsCredentials, data: 1 }
  loop_control:
    label: "{{ item.name }}"

# GitLab deploys as this account; without local admin rights every deploy is "access denied".
- name: Validate deploy accounts are configured
  ansible.builtin.assert:
    that:
      - web_management_service_deploy_accounts is defined
      - web_management_service_deploy_accounts | length > 0
    fail_msg: >-
      Set web_management_service_deploy_accounts (e.g. 'MAIN\sa_ci_cd') in
      inventories/<env>/group_vars/web_api.yml - GitLab deploys fail without it.

- name: Add deploy accounts to the local Administrators group
  ansible.windows.win_group_membership:
    name: Administrators
    members: "{{ web_management_service_deploy_accounts }}"
    state: present

# Windows creates the WMSvc-SHA2 certificate but doesn't connect it - without this WMSvc won't start.
- name: Connect WMSvc to the WMSvc-SHA2 self-signed certificate (registry + 8172 binding)
  ansible.windows.win_shell: |
    $regPath = 'HKLM:\SOFTWARE\Microsoft\WebManagement\Server'
    $cert = Get-ChildItem Cert:\LocalMachine\My |
            Where-Object { $_.Subject -like 'CN=WMSvc-SHA2-*' -and $_.NotAfter -gt (Get-Date) } |
            Sort-Object NotAfter | Select-Object -Last 1
    if (-not $cert) {
      throw "No valid WMSvc-SHA2 certificate in LocalMachine\My - is Web-Mgmt-Service installed?"
    }
    $changed = $false

    $current = (Get-ItemProperty -Path $regPath -Name SslCertificateHash -ErrorAction SilentlyContinue).SslCertificateHash
    if (-not $current -or ([BitConverter]::ToString($current) -ne [BitConverter]::ToString($cert.GetCertHash()))) {
      Set-ItemProperty -Path $regPath -Name SslCertificateHash -Value $cert.GetCertHash() -Type Binary
      $changed = $true
    }

    # Fixed WMSvc application id - any other value (e.g. zeros) stops WMSvc from starting
    $appId   = '{d7d72267-fcf9-4424-9eec-7e1d8dcec9a9}'
    $binding = (netsh http show sslcert ipport=0.0.0.0:8172) -join "`n"
    $correct = ($binding -match $cert.Thumbprint) -and ($binding -match [regex]::Escape($appId))
    if (-not $correct) {
      if ($binding -match 'Certificate Hash') { netsh http delete sslcert ipport=0.0.0.0:8172 | Out-Null }
      netsh http add sslcert ipport=0.0.0.0:8172 certhash=$($cert.Thumbprint) appid=$appId certstorename=MY
      if ($LASTEXITCODE -ne 0) { throw "netsh failed to bind $($cert.Thumbprint) to port 8172" }
      $changed = $true
    }

    if ($changed) { Write-Output "changed" } else { Write-Output "unchanged" }
  register: _wmsvc_cert
  changed_when: "'changed' in _wmsvc_cert.stdout"

- name: Ensure built-in WMSvc firewall rule is enabled
  ansible.windows.win_shell: |
    $rules = Get-NetFirewallRule -DisplayName 'Web Management Service (HTTP Traffic-In)' -ErrorAction SilentlyContinue
    if (-not $rules) { throw "Built-in WMSvc firewall rule not found - is Web-Mgmt-Service installed?" }
    $disabled = $rules | Where-Object Enabled -eq 'False'
    if ($disabled) { $disabled | Enable-NetFirewallRule; Write-Output "changed" } else { Write-Output "unchanged" }
  register: _wmsvc_builtin_rule
  changed_when: "'changed' in _wmsvc_builtin_rule.stdout"

- name: Restart Web Management Service (sets start mode to automatic)
  ansible.builtin.include_tasks: restart_wmsvc.yml

- name: Verify WMSvc is listening on port 8172
  ansible.windows.win_wait_for:
    port: 8172
    timeout: 60
