# Same logic as roles/windows/uipath_orchestrator_migration/tasks/fetch_thumprint.yml
# Finds the certificate by ssl_certificate.subject (imported by the certificate role) and sets ssl_certificate.thumbprint.
- name: Retrieve all certificates from the LocalMachine 
  ansible.windows.win_certificate_info:      
    store_name: "{{ ssl_certificate.store_name }}"
    store_location: "{{ ssl_certificate.store_location }}"
  register: ssl_certificate_info

- name: Normalize the subject and filter for certificates matching the subject
  set_fact:
    matching_certificates: >-
      {{
        ssl_certificate_info.certificates
        | selectattr(
            'subject',
            'search',
            ssl_certificate.subject
            | replace('\\', '\\\\')
            | regex_replace('^"|"$', '') 
            | regex_replace(' OU = ', ', OU=')
            | regex_replace(' O = ', ', O=')
            | regex_replace(' L = ', ', L=')
            | regex_replace(' S = ', ', S=')
            | regex_replace(' C = ', ', C=')
          )
        | list
      }}

- name: Get current epoch time
  ansible.builtin.set_fact:
    current_epoch: "{{ lookup('pipe', 'date +%s') }}"     

- name: Filter for valid (non-expired) certificates
  set_fact:
    valid_certificates: >-
      {{
        matching_certificates | selectattr('valid_to', '>', current_epoch | int) | list
      }}

- name: Fetch the thumbprint of the valid certificate
  set_fact:
    certificate_thumbprint: "{{ valid_certificates[0].thumbprint }}"

- name: Assert that the certificate thumbprint is present
  ansible.builtin.assert:
    that:
      - certificate_thumbprint is defined
      - certificate_thumbprint | length > 0
    fail_msg: "The certificate thumbprint is not defined or is empty."
    success_msg: "The certificate thumbprint is successfully retrieved."    

- name: Repopulate the variable with the thumbprint
  set_fact:
    ssl_certificate: >-
      {{
        ssl_certificate | combine({'thumbprint': certificate_thumbprint})
      }}
  when: valid_certificates | length > 0    
