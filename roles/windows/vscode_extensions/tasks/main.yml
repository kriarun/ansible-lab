---
# VS Code extensions are always per-user. This role makes them "machine-wide":
#  1. place the .vsix files (catalog, install type: vsix_per_user)
#  2. write a script that installs them for the current user
#  3. register the script as a logon installation -> runs once per user at logon
# Revision is automatic (see common/tasks/register_logon_installation.yml).

# Single source: the VS Code path comes from its catalog entry
# (check.path_exists = ...\Code.exe), for the version pinned in vscode_packages.
# No catalog file, no pin or no entry -> empty path -> treated as "no VS Code".
- name: Read VS Code path from its catalog entry
  ansible.builtin.set_fact:
    vscode_cli_path: >-
      {{ (_entry.install.check.path_exists | ansible.builtin.win_dirname) ~ '\bin\code.cmd'
         if _entry.install.check.path_exists is defined else '' }}
  vars:
    _catalog: >-
      {{ lookup('ansible.builtin.template',
                role_path ~ '/../../../profiles/windows/software_catalog/vscode.yml',
                errors='ignore') | default('', true) | from_yaml | default({}, true) }}
    _entry: "{{ _catalog[vscode_packages | default([]) | first | default('')] | default({}) }}"

- name: Check VS Code is installed
  ansible.windows.win_stat:
    path: "{{ vscode_cli_path }}"
  register: _vscode_cli
  when: vscode_cli_path | length > 0

- name: Decide whether VS Code is installed
  ansible.builtin.set_fact:
    _vscode_installed: "{{ _vscode_cli.stat.exists | default(false) }}"

# No VS Code = the machine has no vscode role: skip, don't fail,
# so the other roles still run.
- name: Warn and skip if VS Code is missing
  ansible.builtin.debug:
    msg: "VS Code not found ({{ vscode_cli_path | default('no catalog entry', true) }}). Skipping VS Code extensions."
  when: not _vscode_installed

- name: Install VS Code extensions
  when: _vscode_installed
  block:
    - name: Place VS Code extension files
      ansible.builtin.include_tasks: ../../common/tasks/install_from_catalog.yml
      vars:
        software_catalog_entry: vscode_extensions.yml
        software_package_list: "{{ vscode_extensions_packages }}"

    - name: Install extensions per user at logon
      when: vscode_extensions_packages | length > 0
      ansible.builtin.include_tasks: ../../common/tasks/register_logon_installation.yml
      vars:
        logon_installation_name: vscode_extensions
        logon_installation_command: 'powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "{{ vscode_extensions_script_path }}"'
        # The command never changes (same script path); the LIST does.
        # Keys contain the version, so a version bump changes the content too.
        logon_installation_content: "{{ vscode_extensions_packages | join(',') }}"

    - name: Write per-user extension install script
      when: vscode_extensions_packages | length > 0
      ansible.windows.win_template:
        src: install-extensions.ps1.j2
        dest: "{{ vscode_extensions_script_path }}"
      vars:
        _vsix_files: "{{ resolved_packages | map(attribute='installer.filename') | list }}"
