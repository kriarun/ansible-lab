---
# Copies the bank's internal CA bundle so tools that talk to Artifactory
# (npm, pip) can trust its TLS certificate. Public certificates only.
# Guard: the repo holds a dummy until the real bundle is added. Deploying it
# would make npm/pip trust only the dummy and break every Artifactory call.
- name: Refuse to deploy the dummy CA bundle
  ansible.builtin.assert:
    that: "'DUMMY CA BUNDLE' not in lookup('ansible.builtin.file', 'ca-bundle.crt')"
    fail_msg: >-
      roles/windows/ca_bundle/files/ca-bundle.crt is still the dummy.
      Replace it with the bank's internal CA bundle before deploying.

- name: Ensure CA bundle folder exists
  ansible.windows.win_file:
    path: "{{ ca_bundle_path | win_dirname }}"
    state: directory

- name: Copy internal CA bundle
  ansible.windows.win_copy:
    src: ca-bundle.crt
    dest: "{{ ca_bundle_path }}"
