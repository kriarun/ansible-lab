# Windows Toolbox — Team Neon
# Composition: base profile + team profile + environment add/remove (inventory group_vars).
- name: Windows Toolbox Team Neon
  hosts: team_neon
  gather_facts: false

  vars_files:
    - ../../../profiles/windows/toolbox/base.yml
    - ../../../profiles/windows/toolbox/team_neon.yml

  pre_tasks:
    - name: Compute final roles
      ansible.builtin.set_fact:
        final_roles: >-
          {{
            (
              (base_roles | default([]))
              + (team_roles | default([]))
              + (env_add_roles | default([]))
            )
            | unique
            | reject('in', (remove_roles | default([])) + (env_remove_roles | default([])))
            | list
          }}

    - name: Show composition
      ansible.builtin.debug:
        msg:
          base_roles: "{{ base_roles | default([]) }}"
          team_roles: "{{ team_roles | default([]) }}"
          env_add_roles: "{{ env_add_roles | default([]) }}"
          remove_roles: "{{ remove_roles | default([]) }}"
          env_remove_roles: "{{ env_remove_roles | default([]) }}"
          final_roles: "{{ final_roles }}"
      when: debug_mode | default(false) | bool

  tasks:
    - name: Execute final roles
      ansible.builtin.include_role:
        name: "windows/{{ item }}"
      loop: "{{ final_roles }}"
