machine_roles:
  - prepare_folders
  - hashicorp
  - git
  - dynatrace
  - iis
  - iis_url_rewrite
  - dotnet_hosting
  - certificate
  - web_management_service   # after certificate (binds it to 8172), installs Web-Mgmt-Service
  - microsoft_web_deploy     # after web_management_service: WMSvc must exist for the handler
  - request_router
  - web_api_migration
  - scheduled_tasks

git_packages:
  - git-2.48.1

iis_url_rewrite_packages:
  - iis-url-rewrite-v2

dotnet_hosting_packages:
  - dotnet-hosting-8.0.13-win
  - dotnet-hosting-10.0.1-win

microsoft_web_deploy_packages:
  - microsoft-web-deploy-v3-wmsvc

request_router_packages:
  - request_router_amd64

web_api_migration_backup_dir: 'C:\sources\web_api_migration'

machine_folders:
  - "{{ web_api_migration_backup_dir }}"
