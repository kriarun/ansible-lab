# Team QA toolbox — added on top of profiles/windows/toolbox/base.yml.
team_roles:
  - vscode_extensions
  - node
  - k6
  - k6_studio
  - chrome
  - firefox
  - ctags
  - environment_variables

# VS Code extensions for QA (offline .vsix files, order does not matter).
# Installed per user at logon; revision is automatic.
vscode_extensions_packages:
  - vsix_ms_playwright_playwright_1_1_15
  - vsix_alexkrechik_cucumberautocomplete_3_0_5

node_packages:
  - node_22_14_0

k6_packages:
  - k6_1_7_0

k6_studio_packages:
  - k6_studio_1_5_0

chrome_packages:
  - chrome_153_0_8010_37

firefox_packages:
  - firefox_128_2_0esr

ctags_packages:
  - ctags_p6_2_20251130

# Playwright installs browsers inside each project's node_modules, so the
# browser version always matches the project's Playwright version.
machine_env:
  enabled: true
  variables:
    PLAYWRIGHT_BROWSERS_PATH: "0"

debug_mode: true
installer_cache_dir: "C:\\Temp\\ansible\\installers"
