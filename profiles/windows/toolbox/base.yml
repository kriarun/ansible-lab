# Base toolbox profile — applied to EVERY team toolbox.
# Team-specific software belongs in profiles/windows/toolbox/team_<x>.yml,
# including VS Code extensions (vscode_extensions role, per team).
# Order matters: jdk must precede maven (Maven needs JAVA_HOME).
base_roles:
  - git
  - vscode
  - jdk
  - maven
  - node
  - python
  - bruno

git_packages:
  - git_2_44_0

vscode_packages:
  - vscode_1_87_0

jdk_packages:
  - jdk_23

maven_packages:
  - maven_3_9_9

node_packages:
  - node_22_14_0

# A team can override this list (vars_files: team profile loads after base).
# Lists replace, they don't merge: a team that needs an extra version lists both.
python_packages:
  - python_3_13_2

bruno_packages:
  - bruno_4_2_1
