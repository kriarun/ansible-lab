# Base toolbox profile — applied to EVERY team toolbox.
# Team-specific software belongs in profiles/windows/toolbox/team_<x>.yml.
# Order matters: jdk must precede maven (Maven needs JAVA_HOME).
base_roles:
  - git
  - vscode
  - vscode_extensions
  - jdk
  - maven
  - postman

git_packages:
  - git_2_44_0

vscode_packages:
  - vscode_1_87_0

# Offline .vsix files (order does not matter). Revision is automatic.
vscode_extensions_packages:
  - vsix_ms_playwright_playwright_1_1_15
  - vsix_alexkrechik_cucumberautocomplete_3_0_5

jdk_packages:
  - jdk_23

maven_packages:
  - maven_3_9_9

postman_packages:
  - postman_12_22_6
