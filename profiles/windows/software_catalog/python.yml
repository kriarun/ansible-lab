python_3_10_11:
  source:
    type: jfrog
    url: 'https://jfrog.ch:443/artifactory/robotics-generic-ansible-local/python/3.10.11/python-3.10.11-amd64.exe'
    filename: "python-3.10.11-amd64.exe"
  install:
    type: exe
    arguments: "/quiet InstallAllUsers=1 PrependPath=1 Include_test=0"
    check:
      path_exists: "C:\\Program Files\\Python310\\python.exe"

