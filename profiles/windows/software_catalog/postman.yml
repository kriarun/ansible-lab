# Postman (official Setup.exe, Squirrel). Per-user only installer: placed by
# Ansible, installed into each user's profile at their next logon.
# Postman auto-updates per user afterwards; the pinned version is the baseline.
postman_12_22_6:
  source:
    type: jfrog
    url: 'https://jfrog.ch:443/artifactory/robotics-generic-ansible-local/postman/12.22.6/Postman-win64-12.22.6-Setup.exe'
    filename: "Postman-win64-12.22.6-Setup.exe"
  install:
    type: exe_per_user
    destination: "{{ exe_per_user_dir }}"
    check:
      path_exists: '{{ exe_per_user_dir }}\Postman-win64-12.22.6-Setup.exe'
    arguments: "-s"
