# VS Code extensions (offline .vsix files), installed per user at logon.
# vsix_per_user implies the location (C:\ProgramData\vscode\vsix); the
# vscode_extensions role installs all of them in one Active Setup run.
# Key pattern: vsix_<publisher>_<name>_<version>, dots/dashes -> underscores.

vsix_ms_playwright_playwright_1_1_15:
  source:
    type: jfrog
    url: 'https://jfrog.ch:443/artifactory/robotics-generic-ansible-local/vscode-extensions/ms-playwright.playwright-1.1.15.vsix'
    filename: "ms-playwright.playwright-1.1.15.vsix"
  install:
    type: vsix_per_user

vsix_alexkrechik_cucumberautocomplete_3_0_5:
  source:
    type: jfrog
    url: 'https://jfrog.ch:443/artifactory/robotics-generic-ansible-local/vscode-extensions/alexkrechik.cucumberautocomplete-3.0.5.vsix'
    filename: "alexkrechik.cucumberautocomplete-3.0.5.vsix"
  install:
    type: vsix_per_user
