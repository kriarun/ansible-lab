microsoft-web-deploy-v3:
  source:
    type: local
    path: "D:\\ManualDrops"
    filename: "WebDeploy_amd64_en-US.msi"
  install:
    type: msi
    arguments: "/qn"
    check:
      path_exists: "C:\\Program Files\\IIS\\Microsoft Web Deploy V3\\msdeploy.exe"

web_deploy:
  source:
    type: local
    path: "D:\\ManualDrops"
    filename: "WebDeploy_amd64_en-US.msi"
  install:
    type: msi
    arguments: "/qn"
    check:
      path_exists: "C:\\Program Files\\IIS\\Microsoft Web Deploy V3\\msdeploy.exe"

# Web Deploy with the WMSvc handler - needed for remote deploys from GitLab (port 8172).
microsoft-web-deploy-v3-wmsvc:
  source:
    type: local
    path: "D:\\ManualDrops"
    filename: "WebDeploy_amd64_en-US.msi"
  install:
    type: msi
    arguments: "/quiet /norestart ADDLOCAL=MSDeployFeature,MSDeployUIFeature,DelegationUIFeature,MSDeployWMSVCHandlerFeature"
    check:
      # Delegation dll, not msdeploy.exe - so a basic Web Deploy without the handler is not skipped
      path_exists: "C:\\Program Files\\IIS\\Microsoft Web Deploy V3\\Microsoft.Web.Delegation.dll"
