microsoft-web-deploy-v3:
  source:
    type: local
    path: "D:\\ManualDrops"
    filename: "WebDeploy_amd64_en-US.msi"
  install:
    type: msi
    arguments: "/qn"
    check:
      path_exists: "C:\\Program Files\\IIS\\Microsoft Web Deploy V3\\msdeploy.exe"

web_deploy:
  source:
    type: local
    path: "D:\\ManualDrops"
    filename: "WebDeploy_amd64_en-US.msi"
  install:
    type: msi
    arguments: "/qn"
    check:
      path_exists: "C:\\Program Files\\IIS\\Microsoft Web Deploy V3\\msdeploy.exe"

# Web Deploy WITH the WMSvc handler (remote deploy via https://<host>:8172/msdeploy.axd).
# Separate key so UiPath machines (microsoft-web-deploy-v3) stay unchanged.
# Not ADDLOCAL=ALL: that also installs the Remote Agent Service (MsDepSvc), a second remote endpoint.
microsoft-web-deploy-v3-wmsvc:
  source:
    type: local
    path: "D:\\ManualDrops"
    filename: "WebDeploy_amd64_en-US.msi"
  install:
    type: msi
    arguments: "/qn ADDLOCAL=MSDeployFeature,MSDeployUIFeature,DelegationUIFeature,MSDeployWMSVCHandlerFeature"
    check:
      # delegation dll (seen on the existing machine), not msdeploy.exe - part of the WMSvc/delegation features
      path_exists: "C:\\Program Files\\IIS\\Microsoft Web Deploy V3\\Microsoft.Web.Delegation.dll"
