# IIS Application Request Routing (ARR) - reverse proxy / load balancing for IIS.
# Requires IIS URL Rewrite to be installed first (iis_url_rewrite role runs before request_router).
request_router_amd64:
  source:
    type: local
    path: "D:\\ManualDrops"
    filename: "requestRouter_amd64.msi"
  install:
    type: msi
    arguments: "/qn"
    check:
      path_exists: "C:\\Program Files\\IIS\\Application Request Routing"
