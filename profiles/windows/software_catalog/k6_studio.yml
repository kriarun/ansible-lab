# Grafana k6 Studio (official Setup.exe, Squirrel). Per-user only installer:
# placed by Ansible, installed into each user's profile at their next logon.
# k6 Studio auto-updates per user afterwards; the pinned version is the baseline.
k6_studio_1_5_0:
  source:
    type: jfrog
    url: 'https://jfrog.ch:443/artifactory/robotics-generic-ansible-local/k6-studio/1.5.0/k6.Studio-1.5.0-Setup.exe'
    filename: "k6.Studio-1.5.0-Setup.exe"
  install:
    type: exe_per_user
    destination: "{{ exe_per_user_dir }}"
    check:
      path_exists: '{{ exe_per_user_dir }}\k6.Studio-1.5.0-Setup.exe'
    arguments: "--silent"
