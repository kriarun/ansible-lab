# Visual Studio Code (system installer, machine-wide).
# MERGETASKS=!runcode stops the installer from launching VS Code after setup.
vscode_1_87_0:
  source:
    type: local
    path: "D:\\ManualDrops"
    filename: "VSCodeSetup-x64-1.87.0.exe"
  install:
    type: exe
    arguments: "/VERYSILENT /NORESTART /MERGETASKS=!runcode"
    check:
      path_exists: "C:\\Program Files\\Microsoft VS Code\\Code.exe"
