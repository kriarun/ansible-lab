# Bruno API client (MSI, machine-wide).
# AUTOUPDATE_ENABLED=FALSE turns off the self-updater: upgrades go through a
# new catalog version, so every machine stays on the pinned version.
bruno_4_2_1:
  source:
    type: jfrog
    url: 'https://jfrog.ch:443/artifactory/robotics-generic-ansible-local/bruno/4.2.1/bruno_4.2.1_x64_win.msi'
    filename: "bruno_4.2.1_x64_win.msi"
  install:
    type: msi
    arguments: "/qn AUTOUPDATE_ENABLED=FALSE"
    check:
      path_exists: 'C:\Program Files\Bruno\Bruno.exe'
