# Sandbox: test web_management_service without Vault or the real certificate.
# Uses the self-signed WMSvc-SHA2-<machine> cert that Windows creates when Web-Mgmt-Service is installed.
ssl_certificate:
  subject: 'CN=WMSvc-SHA2'
  store_location: LocalMachine
  store_name: My

# GitLab CI/CD account, added to local Administrators so it can deploy via WMSvc (port 8172)
web_management_service_deploy_accounts:
  - 'MAIN\sa_ci_cd'
