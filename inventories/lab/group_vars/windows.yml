ansible_connection: ssh
ansible_shell_type: powershell
ansible_port: 22
remote_tmp: "C:/Temp/ansible"
installer_cache_dir: "C:/Temp/ansible/installer"

ansible_user: sevice_account_lab
ansible_password: "{{ lookup('env','ANSIBLE_USER_PASSWORD_LAB')}}"

# Packages for installation at user logon (exe_per_user / vsix_per_user).
# Must be readable by all users and writable by admins only: packages here
# run automatically at every user's logon.
exe_per_user_dir: 'C:\ProgramData\Ansible\installers'
vsix_per_user_dir: 'C:\ProgramData\Ansible\vscode-extensions'

# Internal CA bundle (ca_bundle role), used by npm and pip.
ca_bundle_path: 'C:\Users\Public\certs\ca-bundle.crt'
